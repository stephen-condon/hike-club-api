openapi: 3.0.3
info:
  title: Hike Club API
  version: 1.0.0
  description: Private API serving hike schedule, trail map, meeting point, and weather for a single scout hiking club.
servers:
  - url: https://hike-club-api.example.workers.dev
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            text/plain:
              schema:
                type: string
  /hike/{id}:
    get:
      summary: Get a single hike's details, map, and weather
      description: >
        Served via the required `x-api-version` request header, which must
        name `3`, the only current version. It returns `HikeResponseV3`: no
        `start`/`end` (the caller supplies the hike's window as the
        `start`/`end` query parameters, required — the app is the only place
        a hike's date lives), conditions at both ends of the hike window
        (`startConditions`/`endConditions`), and a nullable `map` with
        `mapAvailable`, so a hike whose map image is missing is still served.
        Versions 1 and 2 are past their sunset dates (2026-08-20 and
        2026-09-22) and are no longer served: either returns 410 naming the
        versions still available. A missing or unknown version returns 400.
      parameters:
        - name: id
          in: path
          required: true
          description: >
            The hike's location slug — a `short_name` from `GET /hike-locations`.
            Ids carry no date: there is one record per location, updated in place
            when that location is next scheduled, so a `/hike/{id}` link stays
            valid across reschedules. The hike's date lives only in the app; it
            is supplied per request as `start`/`end`.
          schema:
            type: string
          example: danada-equestrian-center
        - name: start
          in: query
          required: true
          description: >
            RFC 3339 start of the hike window, with the hike's local offset.
            400 if absent, badly formed, or not strictly before `end`.
          schema:
            type: string
            format: date-time
          example: "2026-10-04T09:00:00-05:00"
        - name: end
          in: query
          required: true
          description: RFC 3339 end of the hike window.
          schema:
            type: string
            format: date-time
          example: "2026-10-04T11:00:00-05:00"
        - $ref: "#/components/parameters/ApiVersionHeader"
      responses:
        "200":
          description: Hike found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HikeResponseV3"
        "400":
          description: >
            Missing or unsupported API version, or a missing, malformed, or
            inverted `start`/`end` query parameter
        "401":
          description: Missing or invalid API key
        "404":
          description: No hike with that id
        "410":
          description: Requested API version is past its sunset
        "500":
          description: Internal Server Error
        "502":
          description: Upstream storage error
  /hike-locations:
    get:
      summary: List short-name to full-name mappings for hike locations
      parameters:
        - $ref: "#/components/parameters/ApiVersionHeader"
      responses:
        "200":
          description: Location name mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HikeLocation"
        "400":
          description: Missing or unsupported API version
        "401":
          description: Missing or invalid API key
        "410":
          description: Requested API version is past its sunset
        "500":
          description: >
            Server misconfigured, including a location list that is absent
            from storage (`server misconfigured: location list not found`)
        "502":
          description: The stored location list could not be read
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    ApiVersionHeader:
      name: x-api-version
      in: header
      required: true
      description: >
        API version to serve. `3` is current and the only version with a
        documented response schema. `1` and `2` are known versions past
        their sunset (2026-08-20 and 2026-09-22 respectively) and answer 410;
        they stay listed so a stale client is told its version is finished
        rather than that it never existed.
        The header is required; a missing or unknown value returns 400.
      schema:
        type: string
        enum: ["1", "2", "3"]
  schemas:
    HikeLocation:
      type: object
      required: [short_name, full_name]
      additionalProperties: false
      properties:
        short_name:
          type: string
        full_name:
          type: string
    MeetingPoint:
      type: object
      required: [lat, lon, googleMapsUrl]
      properties:
        lat:
          type: number
        lon:
          type: number
        googleMapsUrl:
          type: string
          format: uri
    MapRef:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    Alert:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
          enum: [precip, nws_alert, heat_index, wind_chill]
        message:
          type: string
    PrecipitationV2:
      type: object
      required: [probabilityPct, expected]
      properties:
        probabilityPct:
          type: integer
          minimum: 0
          maximum: 100
          description: Max hourly probability during the hike window.
        expected:
          type: boolean
          description: Whether any hour on the hike's local calendar day is at/above the likely threshold.
        startsAt:
          type: string
          format: date-time
          nullable: true
          description: Start of the first likely-precip hour (may precede the hike).
        endsAt:
          type: string
          format: date-time
          nullable: true
          description: End of the last likely-precip hour (may follow the hike).
    WeatherV3:
      type: object
      required: [startTempF, endTempF, startConditions, endConditions, precipitation, alerts]
      properties:
        startTempF:
          type: number
        endTempF:
          type: number
        startConditions:
          type: string
          description: Condition phrase of the first in-window period.
        endConditions:
          type: string
          description: Condition phrase of the last in-window period.
        precipitation:
          $ref: "#/components/schemas/PrecipitationV2"
        heatIndexF:
          type: number
          nullable: true
        windChillF:
          type: number
          nullable: true
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
    HikeResponseV3:
      type: object
      required: [id, meetingPoint, trails, map, mapAvailable, weatherAvailable, weather]
      description: >
        Carries no `start`/`end`: the caller supplied the hike's window as
        query parameters, and the app is the only place that window is stored.
      properties:
        id:
          type: string
        meetingPoint:
          $ref: "#/components/schemas/MeetingPoint"
        trails:
          type: array
          items:
            type: string
        map:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MapRef"
        mapAvailable:
          type: boolean
          description: Whether `map` is present; false when the map image could not be confirmed to exist.
        weatherAvailable:
          type: boolean
        weather:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/WeatherV3"
